version: '3.3'

services:
  web:
    image: php:8.2-apache
    container_name: portfolio_web
    restart: unless-stopped
    volumes:
      - ./web:/var/www/html
    environment:
      - MYSQL_USER=portfolio_user
      - MYSQL_PASSWORD=UserSecretPass123!
      - MYSQL_DATABASE=portfolio_db
    command: >
      bash -c "docker-php-ext-install mysqli && apache2-foreground"
    networks:
      - app_network
      - db_network

  db:
    image: mysql:8.0
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootSuperSecurePass2026!
      MYSQL_DATABASE: portfolio_db
      MYSQL_USER: portfolio_user
      MYSQL_PASSWORD: UserSecretPass123!
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - db_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: portfolio_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: RootSuperSecurePass2026!
      PMA_ABSOLUTE_URI: https://192.168.232.128/pma/
    networks:
      - app_network
      - db_network

  nginx:
    image: nginx:alpine
    container_name: portfolio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - phpmyadmin
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
  db_network:
    driver: bridge

volumes:
  db_data:

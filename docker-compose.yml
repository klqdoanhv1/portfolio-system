version: '3.3'

services:
  web:
    image: php:8.2-apache
    container_name: portfolio_web
    restart: unless-stopped
    volumes:
      - ./web:/var/www/html
    environment:
      - MYSQL_USER=portfolio_user
      - MYSQL_PASSWORD=UserSecretPass123!
      - MYSQL_DATABASE=portfolio_db
    command: >
      bash -c "docker-php-ext-install mysqli && apache2-foreground"
    networks:
      - app_network
      - db_network

  db:
    image: mysql:8.0
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootSuperSecurePass2026!
      MYSQL_DATABASE: portfolio_db
      MYSQL_USER: portfolio_user
      MYSQL_PASSWORD: UserSecretPass123!
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - db_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: portfolio_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: RootSuperSecurePass2026!
      PMA_ABSOLUTE_URI: https://192.168.232.128/pma/
    networks:
      - app_network
      - db_network

  nginx:
    image: nginx:alpine
    container_name: portfolio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - phpmyadmin
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    container_name: portfolio_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - app_network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: portfolio_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - app_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: portfolio_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - app_network

  grafana:
    image: grafana/grafana:latest
    container_name: portfolio_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
  db_network:
    driver: bridge

volumes:
  db_data:
